name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # The repo intentionally has no committed npm lockfile, so npm ci/cache
      # cannot work here. npm install creates the transient lock for this build.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build the static GitHub Pages renderer
        run: npm run build:web
        env:
          VITE_BASE_PATH: /d-flat-v41/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
