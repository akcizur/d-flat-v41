name: Electron FPS checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Check Electron and scene architecture
        run: npm run check
      - name: Run player math tests
        run: npm test
      - name: Build renderer
        run: npm run build:web